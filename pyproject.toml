[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyfi-local"
version = "0.1.0"
description = "A private, local-first income and timesheet tracker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
easyfi = "easyfi.__main__:main"

[tool.setuptools.packages.find]
include = ["easyfi*"]

